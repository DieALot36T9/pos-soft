[package]
name = "app"
description = "The Tauri application: commands, session, permission checks, workflows and start-up. The only crate that connects the modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app"

[[bin]]
name = "supershop-pos"
path = "src/main.rs"

[features]
# The dev-only tools (scan simulator, fake scale panel) in a release build.
# Debug builds always have them. Only the Mac demo build turns this on (HW-10).
dev-tools = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
pos-core.workspace = true
db.workspace = true
settings.workspace = true
auth.workspace = true
audit.workspace = true
tax.workspace = true
catalog.workspace = true
pricing.workspace = true
barcode.workspace = true
inventory.workspace = true
sales.workspace = true
shifts.workspace = true
customers.workspace = true
purchasing.workspace = true
reports.workspace = true
io.workspace = true
printing.workspace = true
hardware.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
# File pickers: restore from a backup file, choose backup folders (Reuse Map).
tauri-plugin-dialog.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
# Logs: always warnings and errors, detailed on a switch, daily files kept 14 days (BAK-07).
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
ts-rs.workspace = true
# Preview printouts go to the screen as PNG data URLs.
base64 = "0.22"

[dev-dependencies]
# Reads approved golden pictures back in tests.
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
